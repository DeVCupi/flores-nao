<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flores Amarillas</title>
<meta name="description" content="Un ramo de flores amarillas que florece para Nao.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0f1230;
    --night-deep: #07081a;
    --sun: #ffc93c;
    --gold: #f7a21b;
    --cream: #fff6d6;
    --muted: #b9b39a;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 100%, #1d2150 0%, var(--night) 45%, var(--night-deep) 100%);
    color: var(--cream);
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .msg {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 7vh);
    left: 0; right: 0;
    padding-inline: 20px;
    text-align: center;
    pointer-events: none;
    animation: rise 1.6s .6s both cubic-bezier(.2,.7,.2,1);
  }
  .msg h1 {
    margin: 0;
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 5.2rem);
    line-height: .95;
    letter-spacing: -.01em;
    text-wrap: balance;
    color: var(--sun);
    text-shadow: 0 0 28px rgba(255, 201, 60, .35);
  }
  .msg h1 em { display: block; color: var(--cream); font-size: .62em; margin-top: .15em; }
  .msg p {
    margin: 1rem auto 0;
    max-width: 30ch;
    font-weight: 300;
    font-size: clamp(1rem, 4vw, 1.15rem);
    line-height: 1.5;
    color: var(--muted);
    animation: rise 1.6s 2.2s both cubic-bezier(.2,.7,.2,1);
  }
  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    padding-inline: 16px;
    text-align: center;
    font-size: .78rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(255, 246, 214, .45);
    pointer-events: none;
    animation: rise 1.2s 4s both, breathe 3.5s 5.2s ease-in-out infinite;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    .msg, .msg p, .hint { animation: none; }
  }
</style>

</head><body style="margin:0"><canvas id="c" aria-label="Ramo de flores amarillas floreciendo"></canvas>
<div class="msg">
  <h1>Flores amarillas <em>para Nao</em></h1>
  <p>Te amo, eres una persona hermosa. Gracias por estar en mi vida, mauauamuamuamu</p>
</div>
<div class="hint">Toca para que florezcan más</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  let W = 0, H = 0, dpr = 1;
  const flowers = [];
  const motes = [];
  const falling = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const back = t => { if (t <= 0) return 0; if (t >= 1) return 1; const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeFlower(x, now, delay, hScale) {
    const s = Math.min(W, H);
    const size = rand(.055, .085) * s * (W < 600 ? 1.25 : 1);
    return {
      x,
      h: H * rand(.28, .5) * (hScale || 1),
      bend: rand(-.18, .18) * H * .3,
      size,
      petals: Math.round(rand(11, 16)),
      rot: rand(0, Math.PI * 2),
      hueShift: rand(-6, 8),
      start: now + delay,
      growDur: rand(1600, 2400),
      bloomDur: rand(1300, 1900),
      phase: rand(0, Math.PI * 2),
      leaf: Math.random() < .5 ? 1 : -1,
      shed: rand(4000, 9000)
    };
  }

  function bouquet(now) {
    flowers.length = 0;
    const n = W < 600 ? 9 : 13;
    for (let i = 0; i < n; i++) {
      const u = (i + .5) / n;
      const spread = W < 600 ? .78 : .62;
      const x = W / 2 + (u - .5) * W * spread + rand(-18, 18);
      const center = 1 - Math.abs(u - .5) * 1.1;
      flowers.push(makeFlower(x, now, reduce ? -9999 : 900 + i * 260 + rand(0, 300), .75 + center * .45));
    }
    flowers.sort((a, b) => a.h - b.h);
    motes.length = 0;
    const m = W < 600 ? 28 : 50;
    for (let i = 0; i < m; i++) {
      motes.push({ x: rand(0, W), y: rand(0, H), r: rand(.8, 2.4), vx: rand(-.12, .12), vy: rand(-.25, -.05), ph: rand(0, 6.28) });
    }
  }

  function bez(p0, p1, p2, t) {
    const u = 1 - t;
    return u * u * p0 + 2 * u * t * p1 + t * t * p2;
  }

  function stemPoints(f, sway) {
    const x0 = f.x, y0 = H + 10;
    const x2 = f.x + f.bend + sway, y2 = H - f.h;
    const x1 = f.x + f.bend * .2 - sway * .3, y1 = H - f.h * .55;
    return { x0, y0, x1, y1, x2, y2 };
  }

  function drawStem(f, g, sp) {
    ctx.beginPath();
    ctx.moveTo(sp.x0, sp.y0);
    const steps = 30;
    for (let i = 1; i <= steps * g; i++) {
      const t = i / steps;
      ctx.lineTo(bez(sp.x0, sp.x1, sp.x2, t), bez(sp.y0, sp.y1, sp.y2, t));
    }
    const tipX = bez(sp.x0, sp.x1, sp.x2, g), tipY = bez(sp.y0, sp.y1, sp.y2, g);
    ctx.lineTo(tipX, tipY);
    ctx.strokeStyle = '#3f8f4a';
    ctx.lineWidth = Math.max(2.5, f.size * .09);
    ctx.lineCap = 'round';
    ctx.stroke();
    return { tipX, tipY };
  }

  function drawLeaf(sp, at, side, len, grow) {
    if (grow <= 0) return;
    const x = bez(sp.x0, sp.x1, sp.x2, at), y = bez(sp.y0, sp.y1, sp.y2, at);
    const L = len * ease(grow);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(side * (Math.PI / 2 - .55));
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(L * .35, -L * .32, L * .8, -L * .22, L, 0);
    ctx.bezierCurveTo(L * .75, L * .16, L * .3, L * .18, 0, 0);
    const gr = ctx.createLinearGradient(0, 0, L, 0);
    gr.addColorStop(0, '#2f7a3d');
    gr.addColorStop(1, '#6cbf5c');
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,60,30,.5)';
    ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L * .85, 0); ctx.stroke();
    ctx.restore();
  }

  function petalPath(L, w) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(w, -L * .25, w * .9, -L * .85, 0, -L);
    ctx.bezierCurveTo(-w * .9, -L * .85, -w, -L * .25, 0, 0);
  }

  function drawHead(f, x, y, b, t) {
    const S = f.size;
    const open = back(b);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * .0006 + f.phase) * .06);

    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, S * 2.4);
    glow.addColorStop(0, `rgba(255,201,60,${.22 * open})`);
    glow.addColorStop(1, 'rgba(255,201,60,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, S * 2.4, 0, Math.PI * 2); ctx.fill();

    const layers = [
      { L: S * 1.25, w: S * .3, off: 0, c0: '#e8870f', c1: '#ffc93c', c2: '#ffe27a' },
      { L: S * 1.02, w: S * .27, off: Math.PI / f.petals, c0: '#f7a21b', c1: '#ffd84d', c2: '#fff1a8' }
    ];
    layers.forEach((ly, li) => {
      const lb = ease((b - li * .12) / (1 - li * .12));
      if (lb <= 0) return;
      const L = ly.L * (.25 + .75 * open) * (li ? lb : 1);
      const gr = ctx.createLinearGradient(0, 0, 0, -L);
      gr.addColorStop(0, ly.c0);
      gr.addColorStop(.45, ly.c1);
      gr.addColorStop(1, ly.c2);
      for (let i = 0; i < f.petals; i++) {
        const a = f.rot + ly.off + (i / f.petals) * Math.PI * 2;
        const flutter = Math.sin(t * .0015 + i + f.phase) * .025;
        ctx.save();
        ctx.rotate(a + flutter);
        ctx.scale(1, .55 + .45 * lb);
        petalPath(L, ly.w);
        ctx.fillStyle = gr;
        ctx.fill();
        ctx.strokeStyle = 'rgba(180,90,0,.25)';
        ctx.lineWidth = .7;
        ctx.stroke();
        ctx.restore();
      }
    });

    const R = S * .42 * (.5 + .5 * open);
    const disc = ctx.createRadialGradient(-R * .2, -R * .2, 0, 0, 0, R);
    disc.addColorStop(0, '#a4621a');
    disc.addColorStop(1, '#4a2708');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();

    const seeds = Math.floor(70 * open);
    for (let i = 1; i < seeds; i++) {
      const r = R * .92 * Math.sqrt(i / 70);
      const a = i * GOLDEN;
      ctx.fillStyle = i % 3 ? '#e2a23a' : '#ffd166';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r, Math.sin(a) * r, Math.max(.6, R * .045), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMotes(t) {
    for (const m of motes) {
      if (!reduce) {
        m.x += m.vx + Math.sin(t * .0005 + m.ph) * .15;
        m.y += m.vy;
        if (m.y < -10) { m.y = H + 10; m.x = rand(0, W); }
        if (m.x < -10) m.x = W + 10; else if (m.x > W + 10) m.x = -10;
      }
      const a = .35 + .35 * Math.sin(t * .002 + m.ph);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
      g.addColorStop(0, `rgba(255,230,140,${a})`);
      g.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFalling() {
    for (let i = falling.length - 1; i >= 0; i--) {
      const p = falling[i];
      p.x += p.vx + Math.sin(p.y * .02) * .6;
      p.y += p.vy;
      p.r += p.vr;
      if (p.y > H + 20) { falling.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.scale(1, .6 + .4 * Math.sin(p.r * 2));
      petalPath(p.L, p.L * .28);
      ctx.fillStyle = 'rgba(255,205,70,.85)';
      ctx.fill();
      ctx.restore();
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, H - H * .12, 0, H);
    g.addColorStop(0, 'rgba(20,40,30,0)');
    g.addColorStop(1, 'rgba(12,30,22,.9)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H - H * .12, W, H * .12);
  }

  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    drawMotes(t);
    for (const f of flowers) {
      const e = t - f.start;
      if (e <= 0) continue;
      const g = ease(e / f.growDur);
      const b = Math.min(1, Math.max(0, (e - f.growDur * .85) / f.bloomDur));
      const sway = reduce ? 0 : Math.sin(t * .0008 + f.phase) * f.h * .025 * g;
      const sp = stemPoints(f, sway);
      const tip = drawStem(f, g, sp);
      drawLeaf(sp, .32, f.leaf, f.size * 1.3, (g - .38) * 2.5);
      drawLeaf(sp, .58, -f.leaf, f.size * 1.05, (g - .62) * 2.5);
      if (b > 0) drawHead(f, tip.tipX, tip.tipY, reduce ? 1 : b, t);
      if (!reduce && b >= 1 && e > f.growDur + f.bloomDur + f.shed) {
        f.shed = e - f.growDur - f.bloomDur + rand(5000, 11000);
        if (falling.length < 30) falling.push({ x: tip.tipX, y: tip.tipY, vx: rand(-.4, .4), vy: rand(.5, 1.1), r: rand(0, 6), vr: rand(-.03, .03), L: f.size * .8 });
      }
    }
    drawFalling();
    drawGround();
    if (!reduce) requestAnimationFrame(frame);
  }

  function addAt(x, y) {
    const now = performance.now();
    const f = makeFlower(x, now, 0, 1);
    f.h = Math.max(H * .18, Math.min(H * .8, H - y));
    f.bend = rand(-.06, .06) * H;
    f.growDur *= .7;
    flowers.push(f);
    if (flowers.length > 34) flowers.splice(0, 1);
    flowers.sort((a, b) => a.h - b.h);
    if (reduce) frame(now + 99999);
  }

  cv.addEventListener('pointerdown', e => addAt(e.clientX, e.clientY));
  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { resize(); bouquet(performance.now() - 5000); if (reduce) frame(performance.now()); }, 150);
  });

  resize();
  bouquet(performance.now());
  if (reduce) frame(performance.now()); else requestAnimationFrame(frame);
})();
</script>
</html>
